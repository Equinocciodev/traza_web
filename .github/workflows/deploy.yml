name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Activa Pages (origen: GitHub Actions) en la primera ejecución.
          enablement: true

      - run: npm ci

      - name: Build
        env:
          # Astro lee estas variables en astro.config.ts (site + base).
          # `origin` llega como http:// mientras «Enforce HTTPS» esté sin marcar;
          # se normaliza a https para que canonical, Open Graph y sitemap no queden en claro.
          ORIGIN: ${{ steps.pages.outputs.origin }}
          PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Correo público de contacto: alimenta la página de empresa y el JSON-LD de Organization.
          PUBLIC_CONTACT_EMAIL: contacto@traza.technology
          PUBLIC_CONTACT_EMAIL_EN: contact@traza.technology
          # Analítica: Google Analytics 4 (gtag.js). El identificador de medición es el valor
          # por defecto de `astro.config.ts`, así que aquí basta con elegir el proveedor. Se
          # activa SOLO en producción: en local y en las pruebas queda en «none», que es lo que
          # espera tests/e2e/privacy.spec.ts al comprobar que no se crean cookies. Una variable
          # de Actions del mismo nombre lo sobreescribe, por si hiciera falta apagarlo sin
          # tocar el repositorio.
          PUBLIC_ANALYTICS_PROVIDER: ${{ vars.PUBLIC_ANALYTICS_PROVIDER || 'ga4' }}
        run: |
          export PUBLIC_SITE_URL="${ORIGIN/#http:/https:}"
          echo "site=$PUBLIC_SITE_URL base=$PUBLIC_BASE_PATH"
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
