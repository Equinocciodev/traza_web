name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Activa Pages (origen: GitHub Actions) en la primera ejecución.
          enablement: true

      - run: npm ci

      - name: Build
        env:
          # Astro lee estas variables en astro.config.ts (site + base).
          # `origin` llega como http:// mientras «Enforce HTTPS» esté sin marcar;
          # se normaliza a https para que canonical, Open Graph y sitemap no queden en claro.
          ORIGIN: ${{ steps.pages.outputs.origin }}
          PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Correo público de contacto: alimenta la página de empresa y el JSON-LD de Organization.
          PUBLIC_CONTACT_EMAIL: contacto@traza.technology
          # Analítica. Los valores de Firebase son públicos por diseño (viajan en el bundle del
          # cliente), pero se leen de las *variables* de Actions en vez de fijarse aquí: así la
          # configuración se cambia sin tocar el repositorio y el historial no la arrastra.
          # Defínalas en Settings → Secrets and variables → Actions → Variables.
          # Sin ellas, `firebaseConfigured` es falso y la analítica simplemente no se activa.
          PUBLIC_ANALYTICS_PROVIDER: ${{ vars.PUBLIC_ANALYTICS_PROVIDER || 'none' }}
          PUBLIC_FIREBASE_API_KEY: ${{ vars.PUBLIC_FIREBASE_API_KEY }}
          PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.PUBLIC_FIREBASE_AUTH_DOMAIN }}
          PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.PUBLIC_FIREBASE_PROJECT_ID }}
          PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.PUBLIC_FIREBASE_STORAGE_BUCKET }}
          PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          PUBLIC_FIREBASE_APP_ID: ${{ vars.PUBLIC_FIREBASE_APP_ID }}
          PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ vars.PUBLIC_FIREBASE_MEASUREMENT_ID }}
        run: |
          export PUBLIC_SITE_URL="${ORIGIN/#http:/https:}"
          echo "site=$PUBLIC_SITE_URL base=$PUBLIC_BASE_PATH"
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
